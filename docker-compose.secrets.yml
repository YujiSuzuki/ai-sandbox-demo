# Example Docker Compose override that hides the SecureNote demo's secrets
# from the AI container, the same way the main AI Sandbox devcontainer's
# commented-out example (.devcontainer/docker-compose.yml) describes.
#
# Merge this into your devcontainer's compose setup, e.g. in
# .devcontainer/devcontainer.json:
#   "dockerComposeFile": ["docker-compose.yml", "../demo-project/docker-compose.secrets.yml"]
#
# Paths below assume the standard layout from macos-setup.md, where this repo
# is placed directly under the workspace root as "demo-project". If you placed
# it under a different directory name, update the paths accordingly.
#
# ---
#
# SecureNote デモの秘匿情報をAIコンテナから隠すための、Docker Compose の
# オーバーライド例です。AI Sandbox 本体の .devcontainer/docker-compose.yml に
# あるコメントアウトされたサンプルと同じ内容を、実際に動く形で提供します。
#
# devcontainer 側の compose 設定にマージして使ってください。例えば
# .devcontainer/devcontainer.json では次のように指定します:
#   "dockerComposeFile": ["docker-compose.yml", "../demo-project/docker-compose.secrets.yml"]
#
# 以下のパスは macos-setup.md の標準レイアウト（このリポジトリをワークスペース
# 直下に "demo-project" として配置する構成）を前提にしています。別の
# ディレクトリ名で配置した場合は、パスを実際の配置に合わせて書き換えてください。

services:
  ai-sandbox:
    volumes:
      # Hide the demo apps' .env files
      # Demo アプリの .env ファイルを隠蔽
      - /dev/null:/workspace/demo-project/demo-apps/securenote-api/.env:ro
      - /dev/null:/workspace/demo-project/demo-apps-nextjs/.env:ro
      - /dev/null:/workspace/demo-project/demo-apps-rust/.env:ro

    tmpfs:
      # Make the demo apps' secrets directories empty. The trailing "# @secret"
      # tag marks each entry for validate-secrets.sh / check-secret-sync.sh.
      # Demo アプリの秘匿情報ディレクトリを空にする。末尾の "# @secret" タグは
      # validate-secrets.sh / check-secret-sync.sh が各エントリを秘匿設定
      # として認識するための目印。
      - /workspace/demo-project/demo-apps/securenote-api/secrets  # @secret
      - /workspace/demo-project/demo-apps-nextjs/secrets  # @secret
      - /workspace/demo-project/demo-apps-rust/secrets  # @secret

    # Resolve the demo app's custom domains to the host, so curl/browser
    # access from inside the AI container reaches the host-run containers.
    # デモアプリのカスタムドメインをホストに解決し、AIコンテナ内からの
    # curl・ブラウザアクセスがホスト側で動くコンテナに届くようにする。
    extra_hosts:
      - "securenote.test:host-gateway"
      - "api.securenote.test:host-gateway"
